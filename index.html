<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>MaxGym Bratislava — Pripravujeme</title>
  <meta name="description" content="MaxGym Bratislava pripravujeme.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090909;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 115%, rgba(232, 38, 48, .22), transparent 42%),
        #090909;
    }

    main {
      width: min(90vw, 900px);
      padding: 48px 24px;
      text-align: center;
    }

    .brand {
      margin-bottom: clamp(44px, 9vh, 92px);
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -.06em;
      text-transform: lowercase;
    }

    .brand span { color: #e82630; }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 7.5rem);
      font-weight: 850;
      line-height: .94;
      letter-spacing: -.065em;
      text-transform: uppercase;
    }

    .line {
      width: 72px;
      height: 4px;
      margin: 36px auto 30px;
      border-radius: 999px;
      background: #e82630;
    }

    p {
      margin: 0;
      color: #b8b8b8;
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    a {
      display: inline-block;
      margin-top: 22px;
      color: #fff;
      text-underline-offset: 5px;
      text-decoration-color: #e82630;
    }

    a:hover,
    a:focus-visible { color: #ff5a63; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="MaxGym">max<span>gym</span></div>
    <h1>Pripravujeme</h1>
    <div class="line" aria-hidden="true"></div>
    <p>Nové súkromné fitko v Bratislave.</p>
    <a href="mailto:maxgym@maxgym.sk">maxgym@maxgym.sk</a>
  </main>
</body>
</html>
