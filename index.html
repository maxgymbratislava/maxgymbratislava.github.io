<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MaxGym Bratislava — už čoskoro</title>
  <meta name="description" content="Už čoskoro nový MaxGym Bratislava.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090909;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(0, 0, 0, .48), rgba(0, 0, 0, .62)),
        url("/test/assets/img/home-hero.jpg?v=963204e") center / cover no-repeat;
    }

    main {
      width: min(92vw, 1100px);
      padding: 40px 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #ed1c24;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.035em;
      text-transform: uppercase;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .95);
    }

    @media (max-width: 600px) {
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Už čoskoro nový MAXGYM BRATISLAVA</h1>
  </main>
</body>
</html>
