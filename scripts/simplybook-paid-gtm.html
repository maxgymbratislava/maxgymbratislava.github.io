<script>
(function () {
  'use strict';

  if (location.origin !== 'https://maxgymbratislava.simplybook.it') return;

  var layer = window.dataLayer || [];
  var payment;
  for (var index = layer.length - 1; index >= 0; index--) {
    if (layer[index] && layer[index].event === 'paymentAccepted') {
      payment = layer[index];
      break;
    }
  }
  if (!payment) return;

  var reference = payment.id;
  if (Number.isSafeInteger(reference) && reference > 0) reference = String(reference);
  if (typeof reference !== 'string' || !/^[a-z0-9_-]{1,80}$/i.test(reference)) return;
  var processor = payment.payment_processor;
  if (typeof processor !== 'string' || !/^[a-z0-9_-]{1,60}$/i.test(processor) ||
      /^(delay|pay_later|paylater|cash|manual|free|onsite|offline)$/i.test(processor)) return;

  if (window === window.parent) {
    // SimplyBook's own explicit optional-cookie choice controls standalone visits.
    // Its general allowCookies flag also covers disabled banners and is insufficient.
    if (!/(?:^|;\s*)cookies_accepted=yes(?:;|$)/.test(document.cookie)) return;

    var storageKey = 'maxgym-paid-v1-' + reference;
    window.maxgymCountedStandalone = window.maxgymCountedStandalone || {};
    if (window.maxgymCountedStandalone[reference]) return;
    try { if (sessionStorage.getItem(storageKey)) return; } catch (_) {}

    var current = new URL(location.href);
    var clean = new URL(current.origin + current.pathname);
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (key) {
      var value = current.searchParams.get(key);
      if (value && value.length <= 150 && value.indexOf('@') === -1) clean.searchParams.set(key, value);
    });
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('consent', 'default', {
      analytics_storage: 'granted', ad_storage: 'denied',
      ad_user_data: 'denied', ad_personalization: 'denied'
    });
    window.gtag('js', new Date());
    window.gtag('config', 'G-CLP2PW76E6', {
      send_page_view: false, page_location: clean.href,
      page_referrer: document.referrer.split('?')[0].split('#')[0],
      linker: { accept_incoming: true },
      allow_google_signals: false, allow_ad_personalization_signals: false
    });
    window.gtag('event', 'booking_paid', {
      send_to: 'G-CLP2PW76E6', booking_provider: 'simplybook', page_location: clean.href
    });
    window.maxgymCountedStandalone[reference] = true;
    try { sessionStorage.setItem(storageKey, '1'); } catch (_) {}
    if (!document.getElementById('maxgym-standalone-ga')) {
      var script = document.createElement('script');
      script.id = 'maxgym-standalone-ga'; script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-CLP2PW76E6';
      document.head.appendChild(script);
    }
    return;
  }

  var acknowledged = false;
  var attempts = 0;
  var retry;
  function receive(event) {
    if (event.source !== window.parent || event.origin !== 'https://maxgym.sk' ||
        !event.data || event.data.event !== 'maxgymPaymentAcknowledged' ||
        event.data.reference !== reference) return;
    acknowledged = true;
    clearTimeout(retry);
    window.removeEventListener('message', receive);
  }
  function send() {
    if (acknowledged) return;
    window.parent.postMessage({ event: 'maxgymPaymentAccepted', reference: reference, processor: processor }, 'https://maxgym.sk');
    attempts++;
    if (!acknowledged && attempts < 20) retry = setTimeout(send, 250);
    else if (!acknowledged) window.removeEventListener('message', receive);
  }
  window.addEventListener('message', receive);
  send();
})();
</script>
