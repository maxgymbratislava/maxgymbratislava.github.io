<script>
(function () {
  'use strict';

  if (window === window.parent || location.origin !== 'https://maxgymbratislava.simplybook.it') return;

  var layer = window.dataLayer || [];
  var payment;
  for (var index = layer.length - 1; index >= 0; index--) {
    if (layer[index] && layer[index].event === 'paymentAccepted') {
      payment = layer[index];
      break;
    }
  }
  if (!payment) return;

  var reference = payment.id;
  if (Number.isSafeInteger(reference) && reference > 0) reference = String(reference);
  if (typeof reference !== 'string' || !/^[a-z0-9_-]{1,80}$/i.test(reference)) return;
  var processor = payment.payment_processor;
  if (typeof processor !== 'string' || !/^[a-z0-9_-]{1,60}$/i.test(processor) ||
      /^(delay|pay_later|paylater|cash|manual|free|onsite|offline)$/i.test(processor)) return;

  window.parent.postMessage({ event: 'maxgymPaymentAccepted', reference: reference, processor: processor }, 'https://maxgym.sk');
})();
</script>
